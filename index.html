<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#0b0b0f"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <title>Miloš Team</title>

  <style>

    :root {
      --bg: #0b0b0f;
      --panel: #15151c;
      --panel2: #1c1c25;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #8b5cf6;
      --line: #2a2a35;
      --ok: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        Inter,
        Arial,
        sans-serif;

      min-height: 100%;
    }

    body {
      min-height: 100dvh;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {
      position: sticky;
      top: 0;
      z-index: 10;

      background:
        rgba(11, 11, 15, .92);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid var(--line);

      padding:
        calc(env(safe-area-inset-top) + 12px)
        16px
        12px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .orb {
      width: 48px;
      height: 48px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #2563eb
        );

      display: grid;
      place-items: center;

      font-weight: 800;
      font-size: 21px;

      box-shadow:
        0 8px 30px
        rgba(124, 58, 237, .25);
    }

    .headText {
      min-width: 0;
      flex: 1;
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    .sub {
      margin-top: 3px;
      font-size: 13px;
      color: var(--muted);
    }

    .live {
      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
    }


    /* =====================================================
       CHAT
    ===================================================== */

    #chat {
      flex: 1;

      display: flex;
      flex-direction: column;

      gap: 16px;

      padding:
        18px
        16px
        160px;
    }

    .message {
      max-width: 88%;

      padding:
        14px
        16px;

      border-radius: 20px;

      line-height: 1.55;
      font-size: 16px;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #8b5cf6
        );

      color: white;

      border-bottom-right-radius: 6px;
    }

    .assistant {
      align-self: flex-start;

      background: var(--panel);
      border: 1px solid var(--line);

      border-bottom-left-radius: 6px;
    }

    .error {
      align-self: flex-start;

      background:
        rgba(239, 68, 68, .10);

      border:
        1px solid
        rgba(239, 68, 68, .50);

      color: #fecaca;
    }


    /* =====================================================
       AGENT LABEL
    ===================================================== */

    .agent {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 9px;

      font-size: 12px;
      font-weight: 700;

      color: #c4b5fd;
    }

    .agentDot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--accent);
    }


    /* =====================================================
       WORKFLOW STATUS
    ===================================================== */

    .workflowBox {
      align-self: flex-start;

      width: min(
        92%,
        560px
      );

      padding: 15px 16px;

      border-radius: 20px;

      border:
        1px solid
        var(--line);

      background:
        var(--panel);
    }

    .workflowTitle {
      font-weight: 700;
      font-size: 15px;
    }

    .workflowStatus {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-top: 9px;

      color: var(--muted);
      font-size: 13px;
    }

    .spinner {
      width: 15px;
      height: 15px;

      border-radius: 50%;

      border:
        2px solid
        rgba(139, 92, 246, .25);

      border-top-color:
        #8b5cf6;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }


    /* =====================================================
       AGENT CHIPS
    ===================================================== */

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-top: 12px;
    }

    .chip {
      padding:
        6px 9px;

      border-radius:
        999px;

      background:
        var(--panel2);

      border:
        1px solid
        var(--line);

      color:
        #d4d4d8;

      font-size:
        11px;
    }


    /* =====================================================
       INPUT
    ===================================================== */

    .composerWrap {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 20;

      background:
        linear-gradient(
          transparent,
          rgba(11, 11, 15, .97) 24%
        );

      padding:
        36px
        16px
        calc(
          env(safe-area-inset-bottom)
          + 16px
        );
    }

    .composer {
      max-width: 788px;
      margin: 0 auto;

      display: flex;
      align-items: flex-end;

      gap: 10px;

      border:
        1px solid
        var(--line);

      background:
        var(--panel);

      border-radius:
        25px;

      padding:
        10px;
    }

    textarea {
      flex: 1;

      min-height: 48px;
      max-height: 160px;

      resize: none;

      border: 0;
      outline: 0;

      background: transparent;
      color: var(--text);

      padding:
        12px 10px;

      font-size: 16px;
      font-family: inherit;
    }

    textarea::placeholder {
      color:
        #71717a;
    }

    button {
      flex: 0 0 auto;

      width: 50px;
      height: 50px;

      border: 0;
      border-radius: 17px;

      background: var(--accent);
      color: white;

      font-size: 29px;

      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }


    /* =====================================================
       SMALL STATUS LINE
    ===================================================== */

    #bottomStatus {
      max-width: 788px;
      margin:
        0 auto 7px;

      color: var(--muted);
      font-size: 11px;

      min-height: 15px;
    }

  </style>
</head>


<body>

<div class="app">

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header>

    <div class="top">

      <div class="orb">
        M
      </div>

      <div class="headText">

        <h1>
          Miloš Team
        </h1>

        <div class="sub">
          Eigenanalyse · Recherche · Debatte
        </div>

      </div>

      <div class="live">

        <span class="dot"></span>

        <span>
          live
        </span>

      </div>

    </div>

  </header>


  <!-- ===================================================
       CHAT
  ==================================================== -->

  <main id="chat"></main>


  <!-- ===================================================
       INPUT
  ==================================================== -->

  <div class="composerWrap">

    <div id="bottomStatus"></div>

    <div class="composer">

      <textarea
        id="input"
        rows="1"
        placeholder="Frage Miloš ..."
      ></textarea>

      <button
        id="sendButton"
        type="button"
        aria-label="Senden"
      >
        ↑
      </button>

    </div>

  </div>

</div>


<script>

  // =======================================================
  // KONFIGURATION
  // =======================================================

  const POLL_INTERVAL = 2000;

  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("input");

  const sendButton =
    document.getElementById("sendButton");

  const bottomStatus =
    document.getElementById("bottomStatus");


  // =======================================================
  // SESSION
  // =======================================================

  let sessionId =
    localStorage.getItem(
      "milos_session_id"
    );

  let activeWorkflowId =
    localStorage.getItem(
      "milos_active_workflow"
    );

  let workflowRunning = false;


  // =======================================================
  // HILFSFUNKTIONEN
  // =======================================================

  function scrollBottom() {

    window.scrollTo({
      top:
        document.body.scrollHeight,
      behavior:
        "smooth"
    });

  }


  function setRunning(running) {

    workflowRunning = running;

    sendButton.disabled =
      running;

    input.disabled =
      running;

    bottomStatus.textContent =
      running
        ? "Miloš Team arbeitet im Hintergrund …"
        : "";

  }


  function addUserMessage(text) {

    const box =
      document.createElement("div");

    box.className =
      "message user";

    box.textContent =
      text;

    chat.appendChild(box);

    scrollBottom();
  }


  function addAssistantMessage(
    text,
    agent = "Miloš",
    agents = []
  ) {

    const box =
      document.createElement("div");

    box.className =
      "message assistant";


    const agentLine =
      document.createElement("div");

    agentLine.className =
      "agent";


    const dot =
      document.createElement("span");

    dot.className =
      "agentDot";


    const name =
      document.createElement("span");

    name.textContent =
      agent || "Miloš";


    agentLine.appendChild(dot);
    agentLine.appendChild(name);

    box.appendChild(agentLine);


    const content =
      document.createElement("div");

    content.textContent =
      text || "";

    box.appendChild(content);


    if (
      Array.isArray(agents)
      &&
      agents.length
    ) {

      const chips =
        document.createElement("div");

      chips.className =
        "chips";

      agents.forEach(
        agentName => {

          const chip =
            document.createElement("span");

          chip.className =
            "chip";

          chip.textContent =
            agentName;

          chips.appendChild(chip);

        }
      );

      box.appendChild(chips);
    }


    chat.appendChild(box);

    scrollBottom();
  }


  function addError(text) {

    const box =
      document.createElement("div");

    box.className =
      "message error";

    box.textContent =
      text;

    chat.appendChild(box);

    scrollBottom();
  }


  function createWorkflowBox() {

    const box =
      document.createElement("div");

    box.className =
      "workflowBox";

    box.id =
      "activeWorkflowBox";


    const title =
      document.createElement("div");

    title.className =
      "workflowTitle";

    title.textContent =
      "Miloš arbeitet …";


    const status =
      document.createElement("div");

    status.className =
      "workflowStatus";


    const spinner =
      document.createElement("div");

    spinner.className =
      "spinner";


    const statusText =
      document.createElement("span");

    statusText.id =
      "workflowStatusText";

    statusText.textContent =
      "Workflow wird gestartet";


    status.appendChild(spinner);
    status.appendChild(statusText);

    box.appendChild(title);
    box.appendChild(status);

    chat.appendChild(box);

    scrollBottom();

    return box;
  }


  function getWorkflowBox() {

    return document.getElementById(
      "activeWorkflowBox"
    );

  }


  function removeWorkflowBox() {

    const box =
      getWorkflowBox();

    if (box) {
      box.remove();
    }

  }


  function updateWorkflowBox(
    status
  ) {

    const statusText =
      document.getElementById(
        "workflowStatusText"
      );

    if (!statusText) {
      return;
    }


    if (status === "QUEUED") {

      statusText.textContent =
        "Workflow wird vorbereitet …";

    }

    else if (status === "RUNNING") {

      statusText.textContent =
        "Agenten analysieren und arbeiten …";

    }

    else if (
      status ===
      "WAITING_FOR_USER"
    ) {

      statusText.textContent =
        "Miloš wartet auf deine Antwort.";

    }

    else if (
      status ===
      "WAITING_FOR_APPROVAL"
    ) {

      statusText.textContent =
        "Miloš wartet auf deine Freigabe.";

    }

    else {

      statusText.textContent =
        status;

    }

  }


  // =======================================================
  // HTTP
  // =======================================================

  async function fetchJSON(
    url,
    options = {}
  ) {

    const response =
      await fetch(
        url,
        options
      );

    let data = null;

    try {

      data =
        await response.json();

    }

    catch (_) {

      // Keine JSON-Antwort

    }


    if (!response.ok) {

      const detail =
        data?.detail
        ||
        `HTTP ${response.status}`;

      throw new Error(detail);
    }

    return data;

  }


  // =======================================================
  // WORKFLOW POLLING
  // =======================================================

  async function pollWorkflow(
    workflowId
  ) {

    setRunning(true);

    if (!getWorkflowBox()) {
      createWorkflowBox();
    }


    while (true) {

      try {

        const data =
          await fetchJSON(
            `/api/workflow/${workflowId}`
          );


        updateWorkflowBox(
          data.status
        );


        // -----------------------------------------------
        // FERTIG
        // -----------------------------------------------

        if (
          data.status ===
          "COMPLETED"
        ) {

          removeWorkflowBox();

          addAssistantMessage(
            data.message,
            data.agent || "Miloš",
            data.consulted_agents || []
          );

          activeWorkflowId =
            null;

          localStorage.removeItem(
            "milos_active_workflow"
          );

          setRunning(false);

          input.focus();

          return;
        }


        // -----------------------------------------------
        // FEHLER
        // -----------------------------------------------

        if (
          data.status ===
          "FAILED"
        ) {

          removeWorkflowBox();

          addError(
            "Workflow fehlgeschlagen:\n\n"
            +
            (
              data.error
              ||
              "Unbekannter Fehler."
            )
          );

          activeWorkflowId =
            null;

          localStorage.removeItem(
            "milos_active_workflow"
          );

          setRunning(false);

          return;
        }


        // -----------------------------------------------
        // SPÄTER:
        // WAITING_FOR_USER
        // WAITING_FOR_APPROVAL
        // -----------------------------------------------

      }

      catch (error) {

        console.error(
          "Polling-Fehler:",
          error
        );

        bottomStatus.textContent =
          "Verbindung kurz unterbrochen – Workflow läuft weiter …";

      }


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            POLL_INTERVAL
          )
      );

    }

  }


  // =======================================================
  // NACHRICHT SENDEN
  // =======================================================

  async function sendMessage() {

    if (workflowRunning) {
      return;
    }


    const message =
      input.value.trim();

    if (!message) {
      return;
    }


    addUserMessage(message);

    input.value = "";

    resizeTextarea();

    createWorkflowBox();

    setRunning(true);


    try {

      const data =
        await fetchJSON(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                message:
                  message,

                session_id:
                  sessionId
              })
          }
        );


      // -----------------------------------------------
      // Session speichern
      // -----------------------------------------------

      if (data.session_id) {

        sessionId =
          data.session_id;

        localStorage.setItem(
          "milos_session_id",
          sessionId
        );

      }


      // -----------------------------------------------
      // Workflow speichern
      // -----------------------------------------------

      if (!data.workflow_id) {

        throw new Error(
          "Server hat keine workflow_id geliefert."
        );

      }


      activeWorkflowId =
        data.workflow_id;

      localStorage.setItem(
        "milos_active_workflow",
        activeWorkflowId
      );


      // -----------------------------------------------
      // Jetzt NICHT auf Miloš warten.
      // Status wird separat abgefragt.
      // -----------------------------------------------

      await pollWorkflow(
        activeWorkflowId
      );

    }

    catch (error) {

      console.error(error);

      removeWorkflowBox();

      addError(
        "Verbindungsfehler\n\n"
        +
        (
          error?.message
          ||
          String(error)
        )
      );

      setRunning(false);

    }

  }


  // =======================================================
  // TEXTAREA
  // =======================================================

  function resizeTextarea() {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        160
      )
      +
      "px";

  }


  input.addEventListener(
    "input",
    resizeTextarea
  );


  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
        &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  // =======================================================
  // SEITE WIEDER GEÖFFNET
  // =======================================================

  async function resumeExistingWorkflow() {

    if (!activeWorkflowId) {
      return;
    }

    /*
      Besonders wichtig auf dem iPhone:

      Wenn Safari geschlossen oder aktualisiert wurde,
      kennen wir die workflow_id weiterhin.

      Deshalb versucht die Oberfläche automatisch,
      den laufenden Workflow wieder aufzunehmen.
    */

    createWorkflowBox();

    setRunning(true);

    await pollWorkflow(
      activeWorkflowId
    );

  }


  resumeExistingWorkflow();

</script>

</body>
</html>
