<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <title>Miloš Team 2.0</title>

  <style>
    :root {
      --bg: #0b0b0f;
      --panel: #15151c;
      --panel2: #1c1c25;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #8b5cf6;
      --line: #2a2a35;
      --ok: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        Inter,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 11, 15, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      padding:
        calc(env(safe-area-inset-top) + 12px)
        16px
        12px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .orb {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #2563eb
        );
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 20px;
      box-shadow:
        0 8px 30px rgba(124, 58, 237, 0.25);
    }

    .title-area {
      flex: 1;
    }

    h1 {
      font-size: 18px;
      margin: 0;
    }

    .sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
    }

    main {
      flex: 1;
      width: 100%;
      padding: 18px 14px 150px;
    }

    .welcome {
      margin: 30px auto;
      max-width: 640px;
      text-align: center;
      color: var(--muted);
      line-height: 1.55;
    }

    .welcome strong {
      color: var(--text);
    }

    .message {
      margin: 15px 0;
      display: flex;
      flex-direction: column;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .name {
      font-size: 11px;
      color: var(--muted);
      margin: 0 7px 5px;
    }

    .bubble {
      max-width: 86%;
      border-radius: 18px;
      padding: 12px 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 6px;
    }

    .assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .activity {
      width: min(86%, 680px);
      margin-bottom: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(139, 92, 246, 0.06);
    }

    .activity-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .flow {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--panel2);
      border: 1px solid var(--line);
    }

    .arrow {
      color: var(--muted);
      font-size: 12px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 4px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.3s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding:
        10px
        12px
        calc(env(safe-area-inset-bottom) + 10px);
      background:
        linear-gradient(
          to top,
          var(--bg) 75%,
          rgba(11, 11, 15, 0)
        );
    }

    .composer {
      max-width: 870px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.28);
    }

    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 160px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      line-height: 1.4;
      padding: 11px 10px;
    }

    textarea::placeholder {
      color: #71717a;
    }

    button {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 15px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 19px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .error {
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.4) !important;
      background: rgba(239, 68, 68, 0.08) !important;
    }

    @media (min-width: 700px) {
      main {
        padding-left: 24px;
        padding-right: 24px;
      }

      .bubble {
        max-width: 75%;
      }

      .activity {
        width: min(75%, 680px);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <div class="top">

      <div class="orb">
        M
      </div>

      <div class="title-area">
        <h1>Miloš Team</h1>
        <div class="sub">
          Eigenanalyse · Recherche · Debatte
        </div>
      </div>

      <div class="status">
        <span class="dot"></span>
        live
      </div>

    </div>

  </header>


  <main id="chat">

    <div
      class="welcome"
      id="welcome"
    >
      <strong>Miloš Team 2.0</strong>
      <br><br>
      Miloš kann Spezialisten unabhängig analysieren,
      recherchieren und bei relevanten Meinungsunterschieden
      gegeneinander argumentieren lassen.
    </div>

  </main>


  <div class="composer-wrap">

    <div class="composer">

      <textarea
        id="input"
        rows="1"
        placeholder="Frage Miloš ..."
      ></textarea>

      <button
        id="send"
        aria-label="Senden"
      >
        ↑
      </button>

    </div>

  </div>

</div>


<script>

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const welcome =
  document.getElementById("welcome");


let sessionId =
  localStorage.getItem(
    "milos_session_id"
  );


function scrollBottom() {

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


function hideWelcome() {

  if (welcome) {
    welcome.style.display = "none";
  }

}


function addMessage(
  role,
  name,
  text,
  extraClass = ""
) {

  hideWelcome();

  const wrap =
    document.createElement("div");

  wrap.className =
    `message ${role}`;


  const label =
    document.createElement("div");

  label.className = "name";
  label.textContent = name;


  const bubble =
    document.createElement("div");

  bubble.className =
    `bubble ${extraClass}`;

  bubble.textContent = text;


  wrap.appendChild(label);
  wrap.appendChild(bubble);

  chat.appendChild(wrap);

  scrollBottom();

  return wrap;

}


function addAgentFlow(flow) {

  if (
    !Array.isArray(flow) ||
    flow.length <= 2
  ) {
    return;
  }


  const wrap =
    document.createElement("div");

  wrap.className =
    "message assistant";


  const activity =
    document.createElement("div");

  activity.className =
    "activity";


  const title =
    document.createElement("div");

  title.className =
    "activity-title";

  title.textContent =
    "Tatsächlicher Teamlauf";


  const flowEl =
    document.createElement("div");

  flowEl.className =
    "flow";


  flow.forEach(
    (agent, index) => {

      const chip =
        document.createElement("span");

      chip.className =
        "chip";

      chip.textContent =
        agent;

      flowEl.appendChild(chip);


      if (index < flow.length - 1) {

        const arrow =
          document.createElement("span");

        arrow.className =
          "arrow";

        arrow.textContent =
          "→";

        flowEl.appendChild(arrow);

      }

    }
  );


  activity.appendChild(title);
  activity.appendChild(flowEl);

  wrap.appendChild(activity);

  chat.appendChild(wrap);

}


function addTyping() {

  hideWelcome();

  const wrap =
    document.createElement("div");

  wrap.className =
    "message assistant";


  const label =
    document.createElement("div");

  label.className =
    "name";

  label.textContent =
    "Miloš Team arbeitet";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const typing =
    document.createElement("div");

  typing.className =
    "typing";

  typing.innerHTML =
    "<span></span><span></span><span></span>";


  bubble.appendChild(typing);

  wrap.appendChild(label);
  wrap.appendChild(bubble);

  chat.appendChild(wrap);

  scrollBottom();

  return wrap;

}


async function submit() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  input.value = "";
  input.style.height = "auto";

  addMessage(
    "user",
    "Du",
    text
  );


  send.disabled = true;

  const typing =
    addTyping();


  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: text,
            session_id: sessionId
          })
        }
      );


    const data =
      await response.json();


    typing.remove();


    if (!response.ok) {

      const detail =
        data.detail ||
        "Unbekannter Serverfehler.";

      addMessage(
        "assistant",
        "Fehler",
        detail,
        "error"
      );

      return;

    }


    if (data.session_id) {

      sessionId =
        data.session_id;

      localStorage.setItem(
        "milos_session_id",
        sessionId
      );

    }


    addAgentFlow(
      data.agent_flow
    );


    addMessage(
      "assistant",
      data.agent || "Miloš",
      data.message || ""
    );


  } catch (error) {

    typing.remove();

    addMessage(
      "assistant",
      "Verbindungsfehler",
      String(error),
      "error"
    );

  } finally {

    send.disabled = false;

    input.focus();

  }

}


send.addEventListener(
  "click",
  submit
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();
      submit();

    }

  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        160
      ) + "px";

  }
);

</script>

</body>
</html>
